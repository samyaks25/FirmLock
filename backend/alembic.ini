# Alembic configuration for FirmLock database migrations.
#
# This file is used by the `alembic` command-line tool to configure database
# migrations. The database URL is read from the FIRMLOCK_DATABASE_URL environment
# variable at runtime via env.py, so this file contains only static configuration.
#
# Usage:
#   alembic upgrade head          # Apply all pending migrations
#   alembic downgrade -1          # Roll back the last migration
#   alembic revision --autogenerate -m "Description"  # Create new migration
#   alembic current               # Show current migration version
#   alembic history               # Show migration history

[alembic]
# Path to migration scripts (relative to this file)
script_location = migrations

# Template for new migration files
# Uses UTC timestamps and snake_case for consistency
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Maximum length of migration slug
max_slug_length = 50

# Use UTC for migration timestamps
# timezone = UTC

# Logging configuration for alembic commands
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S